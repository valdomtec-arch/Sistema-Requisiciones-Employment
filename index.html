<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Employment - Portal de Acceso</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --azul-marino: #001F3F;
      --amarillo: #FFCC00;
      --naranja: #FF6600;
      --blanco: #FFFFFF;
      --gris-fondo: #F4F6F9;
      --gris-borde: #CCCCCC;
    }

    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      background: var(--gris-fondo);
      color: var(--azul-marino);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .main-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card-login {
      background: var(--blanco);
      padding: 30px;
      border-radius: 10px;
      border: 1px solid var(--gris-borde);
      border-top: 6px solid var(--azul-marino);
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      text-align: center;
    }

    .logo-container h1 {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      font-size: 1.8rem;
      color: var(--azul-marino);
    }

    .logo-container p {
      margin: 5px 0 20px 0;
      font-size: 0.9rem;
      color: #666666;
    }

    label {
      font-weight: 600;
      font-size: 0.85rem;
      display: block;
      text-align: left;
      margin-top: 12px;
      color: var(--azul-marino);
    }

    input {
      font-size: 0.95rem;
      padding: 12px;
      margin-top: 5px;
      width: 100%;
      box-sizing: border-box;
      border: 1px solid var(--gris-borde);
      border-radius: 6px;
    }

    input:focus {
      outline: none;
      border-color: var(--naranja);
      box-shadow: 0 0 5px rgba(255,102,0,0.3);
    }

    .pass-field-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .pass-field-wrapper input {
      padding-right: 46px;
    }

    .btn-toggle-eye {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-35%);
      background: transparent;
      border: none;
      width: 36px;
      height: 36px;
      padding: 0;
      margin: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666666;
      border-radius: 4px;
      transition: color 0.2s, background-color 0.2s;
    }

    .btn-toggle-eye:hover {
      background-color: #f0f2f5;
      color: var(--azul-marino);
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      cursor: pointer;
      border: none;
      background: var(--naranja);
      color: var(--blanco);
      font-weight: 700;
      padding: 12px;
      border-radius: 6px;
      font-size: 0.95rem;
      width: 100%;
      transition: background 0.2s;
    }

    button:hover {
      background: #e05500;
    }

    .btn-admin {
      background: var(--azul-marino);
      color: var(--amarillo);
      border: 1px solid var(--azul-marino);
    }

    .btn-admin:hover {
      background: #001226;
    }

    .status-msg {
      margin-top: 15px;
      font-size: 0.85rem;
      padding: 10px;
      border-radius: 6px;
      display: none;
    }

    .status-msg.error {
      background: #FFE6E6;
      color: #990000;
      border: 1px solid #FF8A80;
    }

    .status-msg.info {
      background: #E3F2FD;
      color: #0D47A1;
      border: 1px solid #90CAF9;
    }

    footer {
      padding: 15px;
      text-align: center;
      background: var(--azul-marino);
      color: var(--amarillo);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="main-container">
    <div class="card-login">
      <div class="logo-container">
        <h1>Employment</h1>
        <p id="portalSubtitle">Sistema de Requisiciones de Personal</p>
      </div>

      <form id="portalLoginForm">
        <label for="email">Correo Institucional</label>
        <input id="email" type="email" placeholder="usuario@hremploy.com.mx" required />

        <label for="password">Contraseña</label>
        <div class="pass-field-wrapper">
          <input id="password" type="password" placeholder="••••••••" required />
          <button type="button" id="btnTogglePassword" class="btn-toggle-eye" title="Mostrar u ocultar contraseña">
            <svg id="eyeOpenIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg id="eyeClosedIcon" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>

        <div class="btn-group">
          <button type="submit" id="btnLogin">Ingresar al Sistema</button>
          <button type="button" id="btnDirectAdmin" class="btn-admin">Ingresar a RequiAdmin</button>
        </div>
      </form>

      <div id="statusMsg" class="status-msg"></div>
    </div>
  </div>

  <footer>
    Employment Requisiciones v2.0 | Todos los derechos reservados &copy; <span id="fecha"></span>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCGmcrxJsMy5bVS9SgTGLMgrLui_tA6luY",
      authDomain: "sistema-de-requisiciones-47df8.firebaseapp.com",
      databaseURL: "https://sistema-de-requisiciones-47df8-default-rtdb.firebaseio.com",
      projectId: "sistema-de-requisiciones-47df8",
      storageBucket: "sistema-de-requisiciones-47df8.appspot.com",
      messagingSenderId: "596189555034",
      appId: "1:596189555034:web:abcdef1234567890"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const msgBox = document.getElementById("statusMsg");
    const passwordInput = document.getElementById("password");
    const btnTogglePassword = document.getElementById("btnTogglePassword");
    const eyeOpenIcon = document.getElementById("eyeOpenIcon");
    const eyeClosedIcon = document.getElementById("eyeClosedIcon");

    btnTogglePassword.addEventListener("click", () => {
      const isPassword = passwordInput.type === "password";
      passwordInput.type = isPassword ? "text" : "password";
      eyeOpenIcon.style.display = isPassword ? "none" : "block";
      eyeClosedIcon.style.display = isPassword ? "block" : "none";
    });

    function showMsg(text, type = "info") {
      msgBox.className = `status-msg ${type}`;
      msgBox.textContent = text;
      msgBox.style.display = "block";
    }

    async function ejecutarAutenticacion(destino) {
      const email = document.getElementById("email").value.trim();
      const password = passwordInput.value;

      if (!email || !password) {
        showMsg("Por favor, ingresa tu correo y contraseña.", "error");
        return;
      }

      showMsg("Autenticando credenciales...", "info");

      try {
        await signInWithEmailAndPassword(auth, email, password);
        showMsg("Acceso autorizado. Redirigiendo...", "info");
        window.location.href = destino;
      } catch (err) {
        showMsg("Error de autenticación: Verifica tu correo y contraseña.", "error");
      }
    }

    // INGRESO ESTÁNDAR AL DASHBOARD
    document.getElementById("portalLoginForm").addEventListener("submit", (e) => {
      e.preventDefault();
      ejecutarAutenticacion("dashboard.html");
    });

    // INGRESO DIRECTO A REQUIADMIN
    document.getElementById("btnDirectAdmin").addEventListener("click", () => {
      ejecutarAutenticacion("requiadmin.html");
    });

    document.getElementById("fecha").textContent = new Date().getFullYear();
  </script>
</body>
</html>
