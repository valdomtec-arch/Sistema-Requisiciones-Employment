<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Employment - Sistema de Requisiciones</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Roboto&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Roboto', sans-serif; margin: 0; background-color: #FFCC00; }
    h1, h2 { font-family: 'Montserrat', sans-serif; }

    .banner {
      background: linear-gradient(135deg, #FFCC00 70%, #001F3F 30%);
      color: #FFFFFF;
      text-align: center;
      padding: 50px 20px;
    }
    .banner h1 { font-size: 2.8em; margin: 0; color: #001F3F; }
    .banner p { font-size: 1.3em; margin: 10px 0 0; color: #FF6600; font-weight: bold; }

    form {
      margin: 30px auto;
      background: #FFFFFF;
      padding: 20px;
      border-radius: 8px;
      border: 2px solid #001F3F;
      width: 90%;
      max-width: 400px;
      text-align: center;
    }
    input, button {
      margin: 8px;
      padding: 10px;
      width: calc(100% - 20px);
      font-size: 1em;
    }
    button {
      background-color: #FF6600;
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background-color: #001F3F; }

    footer {
      background: #001F3F;
      color: #FFCC00;
      text-align: center;
      padding: 15px;
      font-size: 0.9em;
      position: relative;
      bottom: 0;
      width: 100%;
    }

    .admin-btn {
      display: block;
      margin: 20px auto;
      text-align: center;
      background-color: #001F3F;
      color: #FFCC00;
      padding: 10px 20px;
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
    }
    .admin-btn:hover { background-color: #FF6600; color: #fff; }

    .whatsapp-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #25D366;
      color: white;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      text-decoration: none;
      box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
    }
    .whatsapp-btn:hover { background-color: #128C7E; }
  </style>
</head>
<body>
  <div class="banner">
    <h1>Employment</h1>
    <p>Sistema de Requisiciones con Control Interno</p>
    <p id="conexion"></p>
  </div>

  <!-- Login -->
  <form id="loginForm">
    <h2>Acceso al Sistema</h2>
    <input type="email" id="userEmail" placeholder="Correo electrónico" required>
    <input type="password" id="userPassword" placeholder="Contraseña" required>
    <button type="submit">Ingresar</button>
  </form>

  <!-- Botón Administrador -->
  <button id="adminToggle">Administrador</button>

  <!-- Subformulario de registro oculto -->
  <form id="adminRegisterForm" style="display:none; margin-top:20px;">
    <h2>Registro Administrador</h2>
    <input type="email" id="adminRegEmail" placeholder="Correo electrónico" required>
    <input type="password" id="adminRegPassword" placeholder="Contraseña" required>
    <button type="submit">Registrar Administrador</button>
  </form>

  <!-- Botón administrativo -->
  <a href="requiadmin.html" class="admin-btn">Acceso Administrativo</a>

  <!-- Footer -->
  <footer>
    <p>Todos los derechos reservados por el programador.  
    Cualquier intento de copia o reproducción será penalizado.  
    Este es un software protegido por su institución Employment.  
    <span id="fecha"></span></p>
  </footer>

  <!-- Botones flotantes WhatsApp -->
  <a href="https://wa.me/5219999999999" class="whatsapp-btn" target="_blank" title="Director">📱</a>
  <a href="https://wa.me/5218888888888" class="whatsapp-btn" style="right:90px;" target="_blank" title="Administrador">📱</a>

  <!-- Firebase y lógica -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    // Configuración real de tu proyecto
    const firebaseConfig = {
      apiKey: "AIzaSyCGmcrxJsMy5bVS9SgTGLMgrLui_tA6luY",
      authDomain: "sistema-de-requisiciones-47df8.firebaseapp.com",
      databaseURL: "https://sistema-de-requisiciones-47df8-default-rtdb.firebaseio.com",
      projectId: "sistema-de-requisiciones-47df8",
      storageBucket: "sistema-de-requisiciones-47df8.firebasestorage.app",
      messagingSenderId: "596189555034",
      appId: "1:596189555034:web:41377a532e618a03f4eb63"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    // Confirmación visual de conexión
    document.getElementById("conexion").textContent = "✅ Conexión establecida con Firebase";

    // Login
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("userEmail").value;
      const password = document.getElementById("userPassword").value;
      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const snapshot = await get(ref(db, 'usuarios/' + btoa(email)));
        if (snapshot.exists()) {
          const rol = snapshot.val().rol;
          if (rol === "Solicitante") window.location.href = "requisiciones.html";
          else if (rol === "Jefe de Área") window.location.href = "aprobaciones.html";
          else if (rol === "Finanzas") window.location.href = "reportes.html";
          else if (rol === "Administrador" && email === "jvalladares@hremploy.com.mx") window.location.href = "requiadmin.html";
          else alert("Tu rol aún no ha sido asignado.");
        } else {
          alert("Usuario sin rol asignado.");
        }
      } catch (error) {
        alert("Error en login: " + error.message);
      }
    });

    // Mostrar/ocultar subformulario administrador
    document.getElementById("adminToggle").addEventListener("click", () => {
      const form = document.getElementById("adminRegisterForm");
      form.style.display = form.style.display === "none" ? "block" : "none";
    });

    // Registro exclusivo administrador
    document.getElementById("adminRegisterForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("adminRegEmail").value;
      const password = document.getElementById("adminRegPassword").value;
      if (email !== "jvalladares@hremploy.com.mx") {
        alert("Solo el administrador autorizado puede registrarse aquí.");
        return;
      }
      try {
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        await set(ref(db, 'usuarios/' + btoa(email)), { email, rol: "Administrador" });
        alert("Administrador registrado correctamente.");
        e.target.reset();
      } catch (error) {
        alert("Error en registro: " + error.message);
      }
    });

    // Fecha dinámica en footer
    document.getElementById("fecha").textContent = new Date().toLocaleDateString();
  </script>
</body>
</html>
